<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.2.1/css/all.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
        
        {% if site.logo %}
          <img src="{{site.logo | relative_url}}" alt="Logo" />
        {% endif %}

        <p>{{ site.description | default: site.github.project_tagline }}</p>

        {% if site.github.is_user_page %}
        <a href="{{ site.social.orcid}}" target="_blank"><i class="ai ai-orcid-square ai-2x" aria-hidden="true"></i></a>
        <a href="{{ site.social.google_scholar}}" target="_blank"><i class="ai ai-google-scholar-square ai-2x" aria-hidden="true"></i></a>
        <a href="{{ site.social.semantic_scholar}}" target="_blank"><i class="ai ai-semantic-scholar-square ai-2x" aria-hidden="true"></i></a>
        <a href="{{ site.social.twitter}}" target="_blank"><i class="fa-brands fa-square-twitter fa-2x" aria-hidden="true"></i></a>
        <a href="{{ site.social.linkedin}}" target="_blank"><i class="fa-brands fa-linkedin fa-2x" aria-hidden="true"></i></a>
        <a href="{{ site.social.github}}" target="_blank"><i class="fa-brands fa-square-github fa-2x" aria-hidden="true"></i></a>
        {% endif %}
      </header>
      <section>

      {{ content }}

      </section>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
