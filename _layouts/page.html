<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description"
    content="{{ page.description | default: site.description | default: site.github.project_tagline }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#157878">
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>

<body>
  <section class="page-header">
    <a href="{{ site.github.repository_url }}" style="text-decoration : none; color : #ffffff;">
      <h1 class="project-name">{{ page.title}}</h1>
    </a>
    <h2 class="project-tagline">{{ page.description}}</h2>
  </section>

  <section class="main-content">
    {{ content }}
  </section>

  {% if page.math %}
  <script type="text/x-mathjax-config">
        MathJax.Hub.Config({
          TeX: {
            equationNumbers: {
              autoNumber: "AMS"
            }
          },
          tex2jax: {
            inlineMath: [ ['$','$'] ],
            displayMath: [ ['$$','$$'] ],
            processEscapes: true,
          }
        });
      </script>
  <script type="text/javascript" src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML">
  </script>
  {% endif %}
</body>

</html>
